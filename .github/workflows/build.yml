name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install Buildozer
      run: |
        pip install buildozer cython kivy

    - name: Build APK
      run: |
        buildozer init
        buildozer -v android debug
